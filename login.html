<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - LinkVault</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/logo-copas.png" type="image/png" />
  <meta name="theme-color" content="#F5C842" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LinkVault" />
  <link rel="apple-touch-icon" href="/logo-copas.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Space Mono"', 'monospace'],
          },
          colors: {
            saweria: {
              yellow: '#F5C842',
              teal:   '#3ECFBF',
              red:    '#F25C54',
              bg:     '#FAFAF8',
              border: '#111111',
            },
          },
          boxShadow: {
            brutal:    '4px 4px 0px #111111',
            'brutal-sm': '3px 3px 0px #111111',
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Space Mono', monospace;
      background-color: #FAFAF8;
      background-image: radial-gradient(#ddd 1px, transparent 1px);
      background-size: 22px 22px;
      overflow-x: hidden;
    }
    html.dark body {
      background-color: #1a1a1a;
      background-image: radial-gradient(#2e2e2e 1px, transparent 1px);
      color: #f0f0f0;
    }
    .btn-brutal {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-brutal:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #111111 !important;
    }
    input:focus { outline: none; }
    .spinner {
      border: 3px solid rgba(17,17,17,0.1);
      border-top: 3px solid #3ECFBF;
      border-radius: 50%;
      width: 20px; height: 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== DARK MODE OVERRIDES ===== */
    html.dark .bg-white { background-color: #242424 !important; }
    html.dark .bg-saweria-bg { background-color: #2e2e2e !important; }
    html.dark .border-saweria-border { border-color: #555 !important; }
    html.dark .shadow-brutal { box-shadow: 4px 4px 0px #555; }
    html.dark .shadow-brutal-sm { box-shadow: 3px 3px 0px #555; }
    html.dark .text-saweria-border { color: #f0f0f0; }
    html.dark .text-gray-400 { color: #888 !important; }
    html.dark input {
      background-color: #2e2e2e;
      border-color: #555;
      color: #f0f0f0;
    }
    html.dark input::placeholder { color: #666; }
    html.dark .btn-brutal:active { box-shadow: 0px 0px 0px #555 !important; }
    html.dark #splash { background-color: #1a1a1a !important; }
    html.dark .splash-dot { background-color: #f0f0f0; }
  </style>

  <script>
    (function() {
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#1a1a1a');
      }
    })();
  </script>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <!-- ============ SPLASH SCREEN ============ -->
  <div id="splash" class="fixed inset-0 z-[999] flex flex-col items-center justify-center bg-[#FAFAF8]"
       style="background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 22px 22px;">
    <!-- Icon -->
    <img src="/logo-copas.png" alt="LinkVault" class="w-20 h-20 rounded-2xl border-2 border-[#111] shadow-[4px_4px_0_#111] mb-5" />
    <!-- Wordmark -->
    <h1 style="font-family:'Poppins',sans-serif; font-weight:800; font-size:2rem; line-height:1; color:#111; letter-spacing:-0.03em;">
      linkvault
    </h1>
    <p style="font-family:'Space Mono',monospace; font-size:0.7rem; color:#888; margin-top:6px; letter-spacing:0.1em;">
      SIMPAN · KELOLA · AKSES
    </p>
    <!-- Loading dots -->
    <div class="flex items-center gap-2 mt-8">
      <span class="splash-dot w-2 h-2 rounded-full bg-[#111] inline-block" style="animation: dotBounce 0.9s ease-in-out infinite 0s;"></span>
      <span class="splash-dot w-2 h-2 rounded-full bg-[#111] inline-block" style="animation: dotBounce 0.9s ease-in-out infinite 0.15s;"></span>
      <span class="splash-dot w-2 h-2 rounded-full bg-[#F5C842] border border-[#111] inline-block" style="animation: dotBounce 0.9s ease-in-out infinite 0.3s;"></span>
    </div>
  </div>

  <style>
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.3); opacity: 1; }
    }
    #splash { transition: opacity 0.4s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>

  <script>
    // Sembunyikan splash setelah minimal 1.5 detik
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        const splash = document.getElementById("splash");
        if (splash) {
          splash.classList.add("hide");
          setTimeout(() => splash.remove(), 400);
        }
      }, 1500);
    });
  </script>

  <div class="w-full max-w-sm">

    <!-- Dark Mode Toggle (top-right fixed) -->
    <button
      id="darkModeToggle"
      onclick="toggleDarkMode()"
      class="btn-brutal fixed top-4 right-4 z-50 w-9 h-9 flex items-center justify-center bg-white border-2 border-saweria-border rounded-xl shadow-brutal-sm"
      title="Mode malam"
      aria-label="Toggle mode malam"
    >
      <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
      </svg>
      <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07-.71.71M6.34 17.66l-.71.71m12.02 0-.71-.71M6.34 6.34l-.71-.71M12 8a4 4 0 100 8 4 4 0 000-8z" />
      </svg>
    </button>

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-4">
        <img src="/logo-copas.png" alt="LinkVault" class="w-10 h-10 rounded-xl border-2 border-saweria-border shadow-brutal" />
        <span class="text-2xl font-bold" style="font-family:'Poppins',sans-serif;">linkvault</span>
      </div>
      <p class="text-xs text-gray-400">Masuk untuk mengelola link kamu</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border-2 border-saweria-border rounded-2xl p-6 shadow-brutal">

      <!-- Error alert -->
      <div id="errorAlert" class="hidden mb-4 bg-red-50 border-2 border-saweria-red rounded-xl px-4 py-3">
        <p id="errorMsg" class="text-xs font-bold text-saweria-red"></p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="emailInput" class="block text-xs font-bold mb-1.5 uppercase tracking-wider">Email</label>
          <input
            type="email"
            id="emailInput"
            required
            placeholder="email@kamu.com"
            autocomplete="email"
            class="w-full bg-saweria-bg border-2 border-saweria-border rounded-xl px-4 py-3 text-sm font-mono placeholder-gray-400 focus:border-saweria-teal focus:ring-2 focus:ring-saweria-teal/20 shadow-brutal-sm transition"
          />
        </div>

        <div>
          <label for="passwordInput" class="block text-xs font-bold mb-1.5 uppercase tracking-wider">Password</label>
          <div class="relative">
            <input
              type="password"
              id="passwordInput"
              required
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full bg-saweria-bg border-2 border-saweria-border rounded-xl px-4 py-3 pr-12 text-sm font-mono placeholder-gray-400 focus:border-saweria-teal focus:ring-2 focus:ring-saweria-teal/20 shadow-brutal-sm transition"
            />
            <!-- Show/hide password -->
            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-saweria-border transition"
              title="Tampilkan password"
            >
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="btn-brutal w-full py-3 bg-saweria-yellow border-2 border-saweria-border rounded-xl font-bold text-sm shadow-brutal flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
        >
          <span id="loginBtnContent" class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Masuk
          </span>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-4 font-mono">
      Akses terbatas untuk admin saja.
    </p>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>

  <!-- Dark Mode Toggle -->
  <script>
    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('darkMode', isDark);
      updateDarkModeIcon(isDark);
      // Update theme-color meta for PWA
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', isDark ? '#1a1a1a' : '#F5C842');
    }
    function updateDarkModeIcon(isDark) {
      const iconMoon = document.getElementById('iconMoon');
      const iconSun  = document.getElementById('iconSun');
      if (iconMoon && iconSun) {
        iconMoon.classList.toggle('hidden', isDark);
        iconSun.classList.toggle('hidden', !isDark);
      }
    }
    updateDarkModeIcon(document.documentElement.classList.contains('dark'));
  </script>

  <!-- PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
